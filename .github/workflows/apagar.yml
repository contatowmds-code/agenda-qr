name: Apagar posts repetidos (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  apagar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python agendador/apagar.py
        env:
          META_ACCOUNTS: ${{ secrets.META_ACCOUNTS }}
