name: YouTube - conectar canais dos perfis de mapa
on:
  workflow_dispatch:
    inputs:
      quantos:
        description: "Quantos canais conectar nesta rodada (um código por canal)"
        required: false
        default: "8"
permissions:
  contents: read
jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pynacl
      - run: python agendador/yt_conectar.py
        env:
          QUANTOS: ${{ inputs.quantos }}
          YT_CLIENT_ID__MAPAS: "23695398237-70lkqt2rfp411o1j05rmtrucbjdofdo8.apps.googleusercontent.com"   # identificador público do app (projeto Mapas YouTube); a senha fica no segredo YT_CLIENT_SECRET__MAPAS
          YT_CLIENT_SECRET__MAPAS: ${{ secrets.YT_CLIENT_SECRET__MAPAS }}
          GH_PAT_SEGREDOS: ${{ secrets.GH_PAT_SEGREDOS }}
