name: Conferir publicações e duplicatas (só leitura)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    env:
      VIDEOS_DIR: ${{ github.workspace }}/videos_branch/videos
      META_ACCOUNTS: ${{ secrets.META_ACCOUNTS }}
      YT_REFRESH_TOKEN__QUANTO_RENDE: ${{ secrets.YT_REFRESH_TOKEN__QUANTO_RENDE }}
      YT_REFRESH_TOKEN__QUANTO_VALE: ${{ secrets.YT_REFRESH_TOKEN__QUANTO_VALE }}
      YT_REFRESH_TOKEN__ARQUIVO_VIRAL: ${{ secrets.YT_REFRESH_TOKEN__ARQUIVO_VIRAL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
      TT_PRIVACY: ${{ vars.TT_PRIVACY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python agendador/conferir.py
